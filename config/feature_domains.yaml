# Candidate Stage-2 features grouped into the five thematic domains.
# Stage-1 anchors (institutional births, mortality/morbidity counts and rates) are never listed here;
# src/target/ols_priority_classifier.py enforces that with a leakage firewall.
# Candidates may be removed automatically by the missingness, anchor-proxy and VIF rules; the
# decisions are written to data/processed/feature_selection_audit.csv.
