nfhs5:
  canonical_name: "NFHS-5 India District Factsheets, 2019-2021"
  publisher: "Ministry of Health and Family Welfare / IIPS"
  official_catalog: "https://www.data.gov.in/catalog/national-family-health-survey-5-nfhs-5-india-districts-factsheet-data-provisional"
  mirror_url: "https://raw.githubusercontent.com/SaiSiddhardhaKalla/NFHS/main/India.csv"
  license_note: "Use the official catalog as the source of record; the downloaded machine-readable mirror is derived from official district fact sheets."
  retrieved_file: "data/raw/nfhs5_districts_source.csv"
district_boundaries:
  canonical_name: "NFHS-aligned India district boundaries"
  publisher: "NFHS community data mirror"
  source_url: "https://raw.githubusercontent.com/SaiSiddhardhaKalla/NFHS/main/Districts.geojson"
  retrieved_file: "data/raw/india_districts_source.geojson"
  limitation: "The supplied geometry covers 641 census-era districts; new NFHS-5 districts without matching polygons are listed in data/processed/geo_match_audit.csv as no_polygon and are never fabricated."
hmis:
  canonical_name: "HMIS C2 Data Itemwise Monthly - All States and Districts Across Months"
  publisher: "Ministry of Health and Family Welfare, Government of India"
  standard_reports_url: "https://hmis.mohfw.gov.in/#!/standardReports"
  report_path: "C2 Data Itemwise Monthly (up to sub district) > All States and Districts Across Months"
  annual_files:
    "2017_18": "data/raw/hmis_2017_18_official.zip"
    "2018_19": "data/raw/hmis_2018_19_official.zip"
    "2019_20": "data/raw/hmis_2019_20_official.zip"
  download_url_pattern: "https://hmis.mohfw.gov.in/downloadfiles?filepath=/Standard%20Reports/5~C2.%20Data%20Itemwise%20Monthly%20%28up%20to%20sub%20district%29/3.%20All%20States%20and%20Districts%20Across%20Months/<YYYY-YYYY>.zip"
  limitation: "Public archives in this format exist up to 2019-20; 2020-21 onward require a portal login. The pipeline pools the three pre-COVID years 2017-18 to 2019-20 as counts, aligned on normalised district names, and records years per district (hmis_years_pooled)."
